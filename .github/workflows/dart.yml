name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    needs: analyze
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo chưa có thư mục android/, tạo ở đây. Lệnh này không ghi đè lib/ và pubspec.yaml.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name appiano --org com.appiano .
          rm -rf test

      - name: Install dependencies
        run: flutter pub get

      # Thay icon mặc định bằng logo của app ở mọi mật độ màn hình.
      - name: Set launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}
            size=${d##*:}
            convert assets/ui/logo.png -resize ${size}x${size} \
              android/app/src/main/res/mipmap-$name/ic_launcher.png
          done

      - name: Build release APK
        run: |
          # Một số plugin (file_picker) yêu cầu compileSdk 36 trở lên.
          sed -i -E 's/flutter\.compileSdkVersion/36/' android/app/build.gradle*
          grep -n "compileSdk" android/app/build.gradle*
          # Số phiên bản tăng theo từng lần build để máy cập nhật được.
          sed -i -E "s/^version: .*/version: 0.1.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          flutter build apk --release

      # Chẩn đoán: chỉ in độ dài secret, không in giá trị.
      - name: Check secret presence
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_B64_PLAIN: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_PASS_PLAIN: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASS_PLAIN: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS_PLAIN: ${{ secrets.KEY_ALIAS }}
        run: |
          KS_B64="${KS_B64:-$KS_B64_PLAIN}"; KS_PASS="${KS_PASS:-$KS_PASS_PLAIN}"
          KEY_PASS="${KEY_PASS:-$KEY_PASS_PLAIN}"; KEY_ALIAS="${KEY_ALIAS:-$KEY_ALIAS_PLAIN}"
          echo "len KS_B64=${#KS_B64} KS_PASS=${#KS_PASS} KEY_PASS=${#KEY_PASS} KEY_ALIAS=${#KEY_ALIAS}"

      # Ký bằng keystore cố định (secret). Thiếu secret thì bỏ qua, APK vẫn được tạo.
      # Bật cả chữ ký v1 (máy vivo cần) và v2.
      - name: Sign APK with release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_B64_PLAIN: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_PASS_PLAIN: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASS_PLAIN: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS_PLAIN: ${{ secrets.KEY_ALIAS }}
        run: |
          KS_B64="${KS_B64:-$KS_B64_PLAIN}"; KS_PASS="${KS_PASS:-$KS_PASS_PLAIN}"
          KEY_PASS="${KEY_PASS:-$KEY_PASS_PLAIN}"; KEY_ALIAS="${KEY_ALIAS:-$KEY_ALIAS_PLAIN}"
          if [ -z "$KS_B64" ]; then
            echo "Chưa có secret keystore, giữ APK ký bằng debug key."
            exit 0
          fi
          KS="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$KS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --target "${{ github.sha }}" \
            --title "Appiano $TAG" \
            --notes "APK build tự động từ commit ${{ github.sha }}"
