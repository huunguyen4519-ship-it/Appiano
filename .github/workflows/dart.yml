name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    needs: analyze
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo chưa có thư mục android/, tạo ở đây. Lệnh này không ghi đè lib/ và pubspec.yaml.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name appiano --org com.appiano .
          rm -rf test

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          # Một số plugin (file_picker) yêu cầu compileSdk 36 trở lên.
          sed -i -E 's/flutter\.compileSdkVersion/36/' android/app/build.gradle*
          grep -n "compileSdk" android/app/build.gradle*
          flutter build apk --release --split-per-abi

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --target "${{ github.sha }}" \
            --title "Appiano $TAG" \
            --notes "APK build tự động từ commit ${{ github.sha }}"
